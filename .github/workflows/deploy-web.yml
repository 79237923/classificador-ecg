# Publica a versão navegador no GitHub Pages a cada push na main.
#
# O pacote com o motor Python (web/cardiolaudo.zip) é reconstruído aqui a partir
# do código-fonte, e não commitado pronto: assim ele nunca fica defasado em
# relação ao backend/ que o gera.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        # O NeuroKit2 é necessário porque o pacote da versão web inclui os .py
        # dele (não é instalável pelo micropip dentro do navegador).
        run: pip install -r requirements.txt

      - name: Montar o pacote do motor
        run: python scripts/build_web.py

      - name: Conferir que o pacote foi gerado
        run: |
          test -f web/cardiolaudo.zip || { echo "pacote não gerado"; exit 1; }
          ls -lh web/

      # O navegador guarda o motor em cache permanente sob uma URL que carrega a
      # impressão digital do conteúdo. Se a impressão publicada não corresponder
      # aos bytes publicados, quem já visitou o site fica preso na versão antiga
      # sem qualquer sinal de erro. Falhar aqui é a única defesa contra isso.
      - name: Conferir as impressões digitais do motor
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys

          web = pathlib.Path("web")
          arquivo = web / "versao.json"
          if not arquivo.exists():
              sys.exit("versao.json não foi gerado")

          versao = json.loads(arquivo.read_text(encoding="utf-8"))
          for chave, nome in (("motor", "cardiolaudo.zip"), ("ponte", "analise.py")):
              real = hashlib.sha256((web / nome).read_bytes()).hexdigest()[:12]
              if versao.get(chave) != real:
                  sys.exit(f"{nome}: versao.json diz {versao.get(chave)!r}, "
                           f"o conteúdo publicado é {real!r}")
          print("impressões digitais conferem:", versao)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
